[workspace]
members = ["crates/dcc-daemon"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/dcc-bigfred/rust-commons"
homepage = "https://github.com/dcc-bigfred/rust-commons"
authors = ["dcc-bigfred"]

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
